<!-- Impressed homepage "Twee paden, één deur": plak dit in een HTML-blok in Elementor -->
<div id="impressed-homepage" style="min-height:100vh"></div>
<script>
(function(){
  var BASE = 'https://impressedpaper.github.io/Impressed-paginas/homepage/';
  var host = document.getElementById('impressed-homepage');
  if (!host || host.shadowRoot) return;
  var f = document.createElement('link');
  f.rel = 'stylesheet';
  f.href = 'https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&family=Oooh+Baby&display=swap';
  document.head.appendChild(f);
  fetch(BASE + 'index.html?v=' + Date.now()).then(function(r){ return r.text(); }).then(function(html){
    html = html.replace(/(src|poster)="media\//g, '$1="' + BASE + 'media/').replace(/url\(media\//g, 'url(' + BASE + 'media/');
    var d = new DOMParser().parseFromString(html, 'text/html');
    var sr = host.attachShadow({mode:'open'});
    var st = document.createElement('style');
    st.textContent = Array.prototype.map.call(d.querySelectorAll('style'), function(s){ return s.textContent; }).join('\n');
    sr.appendChild(st);
    sr.appendChild(document.importNode(d.querySelector('.cc-scope'), true));
    host.style.minHeight = '';
    window.__hpRoot = sr;
    Array.prototype.forEach.call(d.querySelectorAll('script'), function(s){
      var n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n);
    });
  });
})();
</script>
